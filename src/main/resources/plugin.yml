name: BanMace
version: '1.12.5'
main: org.nakolotnik.banMace.BanMace
api-version: '1.21'

commands:
  bm-setlanguage:
    description: Change the plugin language.
    usage: /bm-setlanguage [en|ru]
    permission: banmace.bm-setlanguage
  bm-give:
    description: Give the Ban Mace to a player.
    usage: /banmace bm-give
    permission: banmace.bm-give
  bm-changeview:
    description: Change the message display mode.
    usage: /bm-changeview <chat|actionbar|title>
    permission: banmace.bm-changeview
    permission-message: You do not have permission to use this command.
  bm-tpcoordinates:
    description: Teleport the player to specified coordinates.
    usage: /bm-tpcoordinates <x> <y> <z>
    permission: banmace.tpcoordinates
    permission-message: You do not have permission to use this command.
  bm-help:
    description: Show a list of available BanMace commands.
    usage: /bm-help
    permission: banmace.bm-help
    permission-message: You do not have permission to use this command.
  bm-settings:
    description: Opens the plugin settings GUI.
    usage: /bm-settings
    permission: banmace.settings
    permission-message: You do not have permission to use this command.

permissions:
  banmace.bypass:
    description: Grants immunity from all BanMace effects.
    default: op

  banmace.use:
    description: Allows using the BanMace and its basic commands.
    default: op

  banmace.admin:
    description: Allows access to administrative commands like /bm-settings.
    default: op
    children:
      banmace.use: true

  banmace.mode.ban:
    description: Allows using the Ban mode.
    default: op
  banmace.mode.kick:
    description: Allows using the Kick mode.
    default: op
  banmace.mode.freeze:
    description: Allows using the Freeze mode.
    default: op
  banmace.mode.ballon:
    description: Allows using the Ballons mode.
    default: op
  banmace.mode.spawn:
    description: Allows using the Spawn Teleport mode.
    default: op
  banmace.mode.bed:
    description: Allows using the Bed Teleport mode.
    default: op
  banmace.mode.teleport:
    description: Allows using the Coordinate Teleport mode.
    default: op

  banmace.bm-setlanguage:
    description: Allows changing the plugin language.
    default: op

  banmace.give:
    description: Allows giving the Ban Mace to a player.
    default: op

  banmace.bm-changeview:
    description: Allows changing the message display mode (chat, actionbar, title).
    default: op

  banmace.tpcoordinates:
    description: Allows the player to use the teleport-to-coordinates command.
    default: op

  banmace.bm-help:
    description: Allows a player to view the list of available commands for BanMace.
    default: op

  banmace.update.notify:
    description: Allows receiving update notifications for BanMace.
    default: op